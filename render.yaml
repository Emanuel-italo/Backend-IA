# Blueprint do Render: Dashboard > New > Blueprint > selecione este repositório.
services:
  - type: web
    name: rota-leve-ai
    runtime: python
    rootDir: rota-leve-ai
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_REASONING_EFFORT  # para modelos de raciocínio (openai/gpt-oss-*); ignorado se o modelo recusar
        value: low
      - key: LLM_API_KEY      # chave da Groq: preenchida no painel, nunca no repositório
        sync: false
      - key: LLM_MODEL        # ID do modelo em https://console.groq.com/docs/models
        sync: false
      - key: SERVICE_API_KEY  # gerada pelo Render; copie do painel para as APIs Java/.NET
        generateValue: true
